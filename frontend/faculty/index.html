<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarSync - Faculty Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="brand-background">ScholarSync</div>
    <div class="portal-container">
        <div class="main-logo">
            <h1>ScholarSync</h1>
            <p>Seamless Academic Management</p>
        </div>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="welcome-section">
            <h1>Welcome to Faculty Portal</h1>
            <p>Manage your courses and student grades</p>
        </div>

        <div class="courses-section">
            <h2>My Courses</h2>
            <div class="courses-grid" id="coursesGrid">
                <!-- Course cards will be dynamically added here -->
            </div>
        </div>
    </div>

    <script src="courses.js"></script>
</body>
</html>
